schema: umicom.application.v1

application:
  id: org.umicom.integration-studio
  name: Umicom Integration Studio
  short_name: Integration Studio
  version: 0.1.0
  executable: umicom-integration-studio-console
  aliases: [integration-studio]

framework:
  minimum_version: 0.9.0
  compatible_major: 0

frontends:
  - console

entry:
  kind: workbench
  taskbar_group: enterprise
  pinned_by_default: false
  default_layout: design

capabilities:
  - umicom.integration
  - umicom.messaging
  - umicom.operations
  - umicom.application.experience
  - umicom.application.federation

source_layout:
  product_root: src
  composition_root: src
  console_frontend: src/console

boundaries:
  owns_reusable_framework_logic: false
  owns_persistence: false
  consumes_framework_services: true
